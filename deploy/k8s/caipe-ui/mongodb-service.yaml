apiVersion: v1
kind: Service
metadata:
  name: caipe-mongodb
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-mongodb
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caipe-mongodb
    app.kubernetes.io/component: database
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
