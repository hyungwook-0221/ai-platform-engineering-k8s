apiVersion: apps/v1
kind: Deployment
metadata:
  name: caipe-mongo-express
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-mongo-express
    app.kubernetes.io/component: database-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caipe-mongo-express
      app.kubernetes.io/component: database-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caipe-mongo-express
        app.kubernetes.io/component: database-admin
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: caipe-mongodb-secret
                  key: MONGODB_ROOT_USERNAME
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: caipe-mongodb-secret
                  key: MONGODB_ROOT_PASSWORD
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://$(MONGODB_ROOT_USERNAME):$(MONGODB_ROOT_PASSWORD)@caipe-mongodb:27017/"
            - name: ME_CONFIG_BASICAUTH
              value: "false"
          envFrom:
            - secretRef:
                name: caipe-mongodb-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: caipe-mongo-express
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-mongo-express
    app.kubernetes.io/component: database-admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caipe-mongo-express
    app.kubernetes.io/component: database-admin
  ports:
    - name: http
      port: 8081
      targetPort: http
