apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caipe-mongodb-data
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-mongodb
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caipe-mongodb-config
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-mongodb
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
