apiVersion: apps/v1
kind: Deployment
metadata:
  name: caipe-ui
  namespace: ai-platform-engineering
  labels:
    app.kubernetes.io/name: caipe-ui
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caipe-ui
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caipe-ui
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: caipe-ui
          image: ghcr.io/cnoe-io/caipe-ui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: caipe-ui-config
            - secretRef:
                name: caipe-ui-secret
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
