tags:
  agent-aws: true
  caipe-ui: false

global:
  createLlmSecret: false
  llmSecrets:
    create: false
    secretName: "llm-secret"

agent-aws:
  image:
    repository: "your-registry.example.com/agent-aws-uvx"
    tag: "0.1.0"
  env:
    UV_CACHE_DIR: "/tmp/uv-cache"
    XDG_CACHE_HOME: "/tmp"
    XDG_DATA_HOME: "/tmp"
    HOME: "/tmp"
